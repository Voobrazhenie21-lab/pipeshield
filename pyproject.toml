[project]
name = "pipeshield"
version = "1.1.0"
description = "Modern DevSecOps & Web Recon security scanner for Secrets, Dockerfile hardening, CI/CD supply chain, and JS/TS bundles"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Aleksei Zharkou", email = "lyosha.zharkov.98@mail.ru" }
]
keywords = [
    "security",
    "devsecops",
    "appsec",
    "secret-detection",
    "docker-security",
    "cicd-security",
    "sarif",
    "github-actions"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.scripts]
pipeshield = "pipeshield.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
